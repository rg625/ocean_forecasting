# Fair-horizon CT-KAE with a multiscale decoder (2026-10-21): identical to fair_h8.yaml
# (latent 256) except that z also writes 16 / 4 / 2 channels directly onto the decoder's
# 16x32 / 32x64 / 64x128 grids, a linear POD-like path to the fine scales (models/ct_kae.py,
# z_inject). Target: lower first-step (reconstruction) error with long-lead error unchanged.
#
# Fair-horizon CT-KAE (2026-10-20 requirements):
#   - trained purely for forecasting, end-to-end (no DA objective, no frozen stages)
#   - horizon comparable to the baselines: 2 conditioning frames -> 8 predicted frames
#     (U-Net_ut unrolls 8-frame windows; the original KAE trained 2 -> 8), every predicted
#     frame supervised, stride 2 only (dt = 0.1, as ACDM), so the horizon in time matches
#   - data as ACDM: the 33 training simulations, all frames, random offsets, no
#     validation split, final checkpoint used
#   - purely linear latent dynamics dz/dt = A(Ma) z (fixed_point: none; mu had no effect)
run_name: fair_h8_ms
out_root: model_outputs_ctkae
seed: 0
data:
  train_file: data/acdm/128_tra/train.nc
  val_ma: []
  extra_raw_sims: [data/raw_tra/sim_000040]
model:
  latent_dim: 256
  z_inject: [16, 4, 2]
  widths: [64, 128, 256]
  blocks_per_stage: 2
  n_frames: 2
  cond_ref: [0.7]
  cond_scale: [0.1]
  film_encoder: true
  film_decoder: true
  cond_generator: true
  fixed_point: none
  generator: block
train:
  steps: 20000
  batch: 16
  lr: 3.0e-4
  k_start: 8
  k_max: 8
  n_dec: 8
  strides: [2]
  w_rec: 1.0
  w_pred: 1.0
  w_lat: 0.1
  w_amp: 0.1
  val_every: 2000
