# Adopted CT-KAE for the transonic flow (Tra), Nov 2026: the reference (fair_h8 at latent 256)
# plus backward latent consistency at weight 0.01 ("back001"). Fully resolved from the run
# config of model_outputs_ctkae/AB_back001_s{0,1,2} (seeds 0-2), so changes to the training
# defaults do not change this model. Train:
#   python train_ctkae.py --config=configs/ctkae/tra_back001.yaml [seed=1 ...]
# Forecast readout: LPM mirror average (audit_report/scripts/postproc3/sharp.py, lpm).
# DA: data_assimilation/tra/exp_tra.py --kae-kind ctkae --kae-run RUN --kae-ckpt last.pth
#     --kae-mirror --kae-avg lpm
run_name: tra_back001
out_root: model_outputs_ctkae
seed: 0
data:
  train_file: data/acdm/128_tra/train.nc
  val_ma: []
  extra_raw_sims: [data/raw_tra/sim_000040]
model:
  latent_dim: 256
  widths: [64, 128, 256]
  blocks_per_stage: 2
  n_frames: 2
  cond_ref: [0.7]
  cond_scale: [0.1]
  film_encoder: true
  film_decoder: true
  cond_generator: true
  fixed_point: none
  generator: block
train:
  steps: 20000
  batch: 16
  lr: 0.0003
  weight_decay: 0.0001
  warmup: 500
  grad_clip: 1.0
  k_start: 8
  k_max: 8
  curriculum_frac: 0.5
  k_hold_frac: 0.0
  n_dec: 8
  strides: [2]
  amp: true
  channel_weighting: phys
  w_rec: 1.0
  w_pred: 1.0
  w_lat: 0.1
  w_amp: 0.1
  w_tc: 0.0
  w_lead_ramp: 1.0
  pred_weighting: uniform
  w_back: 0.01
  w_cos: 0.0
  w_energy: 0.0
  w_sob_t: 0.0
  w_sob_x: 0.0
  w_spec: 0.0
  w_bpred: 0.0
  accum: 2
  fine_targets: false
  ma_noise: 0.0
  input_noise: 0.0
  latent_noise: 0.0
  tc_starts: [0, 2, 4]
  val_every: 2000
  log_every: 100
  select: val_mse60+0.25*val_mse240
