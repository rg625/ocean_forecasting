# CT-KAE trained in the ACDM setting (autoreg_pde_diffusion training_diffusion_tra.py):
#   training set  = official sims 3-13 and 19-40 (train.nc + raw sim 40, Ma 0.90), 33 sims
#   all 1000 frames, stride 2 (dt = 0.1), random window offsets
#   sequenceLength [3, 2] = 2 conditioning frames + 1 predicted frame (K = 1)
#   batch 64, no validation split, final checkpoint used
run_name: acdm_block
out_root: model_outputs_ctkae
seed: 0
data:
  train_file: data/acdm/128_tra/train.nc
  val_ma: []
  extra_raw_sims: [data/raw_tra/sim_000040]
model:
  latent_dim: 256
  widths: [64, 128, 256]
  blocks_per_stage: 2
  n_frames: 2
  cond_ref: [0.7]
  cond_scale: [0.1]
  film_encoder: true
  film_decoder: true
  cond_generator: true
  fixed_point: conditional
  generator: block
train:
  steps: 12000
  batch: 64
  lr: 3.0e-4
  k_start: 1
  k_max: 1
  n_dec: 1
  strides: [2]
  w_rec: 1.0
  w_pred: 1.0
  w_lat: 0.1
  w_amp: 0.1
  val_every: 1000
