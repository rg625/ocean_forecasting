# back001 (model_outputs_ctkae/AB_back001, TRA) on KS: configs/ctkae_ks/ref.yaml plus backward
# latent consistency at weight 0.01 (the only difference between the two TRA candidates).
run_name: ks_back001
model:
  in_channels: 1
  n_frames: 1
  height: 1
  width: 64
  latent_dim: 256
  widths: [64, 128, 256]
  blocks_per_stage: 2
  film_encoder: false
  film_decoder: false
  cond_generator: false
  fixed_point: none
  generator: block
  padding_mode: circular
train:
  steps: 20000
  batch: 16
  lr: 0.0003
  weight_decay: 0.0001
  warmup: 500
  grad_clip: 1.0
  k_start: 8
  k_max: 8
  curriculum_frac: 0.5
  n_dec: 8
  amp: true
  w_rec: 1.0
  w_pred: 1.0
  w_lat: 0.1
  w_amp: 0.1
  val_every: 2000
  log_every: 100
  w_back: 0.01
