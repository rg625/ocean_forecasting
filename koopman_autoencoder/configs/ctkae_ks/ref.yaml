# CT-KAE reference (model_outputs_ctkae/H8_d256, TRA) on KS: same latent size, widths, block
# generator, no fixed point, objective and schedule. KS-specific: 1 channel on a 1 x 64
# periodic grid (circular padding), one input frame (KS is Markovian; the KS baselines encode
# one frame), no physical parameter (FiLM and the conditional generator off), dt 0.1 (stride 1;
# the TRA stride 2 x 0.05 is the same physical step), channel weighting uniform.
run_name: ks_ref
model:
  in_channels: 1
  n_frames: 1
  height: 1
  width: 64
  latent_dim: 256
  widths: [64, 128, 256]
  blocks_per_stage: 2
  film_encoder: false
  film_decoder: false
  cond_generator: false
  fixed_point: none
  generator: block
  padding_mode: circular
train:
  steps: 20000
  batch: 16
  lr: 0.0003
  weight_decay: 0.0001
  warmup: 500
  grad_clip: 1.0
  k_start: 8
  k_max: 8
  curriculum_frac: 0.5
  n_dec: 8
  amp: true
  w_rec: 1.0
  w_pred: 1.0
  w_lat: 0.1
  w_amp: 0.1
  val_every: 2000
  log_every: 100
