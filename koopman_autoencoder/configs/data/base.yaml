# configs/data/base.yaml
# base config for data loading

# data:
dataset_type: "QGDatasetMultiSim" # "QGDatasetMultiSim" # "SingleSimOverfit"
data_dir: "./data"
train_file: "acdm/128_inc/train.nc"
val_file: "acdm/128_inc/val.nc"
test_file: "acdm/128_inc/test.nc"
input_sequence_length: 2
max_sequence_length: 8
subsample: 2
exhaustive: true
variables:
  v_x: 1
  v_y: 1
  p: 1
static_variables:
  obstacle_mask: 1
normalization:
  type: "MeanStdNormalizer"
  sim: 0
quantile_range: [2.5, 97.5]

control_parameters: ["Re"]
selection_param: "Re"

train_select_cond: null
val_select_cond: 100
test_select_cond: null

num_workers: 8
